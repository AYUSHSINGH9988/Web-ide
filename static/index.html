<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Pro Web IDE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-editor:#1e1e1e;
    --bg-sidebar:#181818;
    --bg-activitybar:#151515;
    --bg-panel:#181818;
    --bg-titlebar:#232323;
    --bg-tab:#1e1e1e;
    --bg-tab-active:#1e1e1e;
    --bg-tab-inactive:#181818;
    --border:#2b2b2b;
    --text-main:#d4d4d4;
    --text-dim:#8a8a8a;
    --text-faint:#5a5a5a;
    --accent:#3b82f6;
    --accent-dim:#264a78;
    --ok:#3fb950;
    --err:#f85149;
    --warn:#d29922;
    --radius:4px;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg-editor);color:var(--text-main);
    font-family:var(--font-ui);font-size:13px;
    overflow:hidden;
  }
  #app{
    display:grid;
    grid-template-rows:38px 1fr;
    height:100vh;
    width:100vw;
  }

  /* ---------- Title bar ---------- */
  #titlebar{
    background:var(--bg-titlebar);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;
    padding:0 10px;gap:10px;
    -webkit-app-region:drag;
  }
  #titlebar .brand{
    display:flex;align-items:center;gap:7px;
    font-weight:600;font-size:12.5px;color:#e8e8e8;
    letter-spacing:.2px;
  }
  #titlebar .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
  #titlebar .spacer{flex:1;}
  .btn{
    background:#2a2a2a;border:1px solid var(--border);color:var(--text-main);
    border-radius:var(--radius);padding:5px 12px;font-size:12px;cursor:pointer;
    display:flex;align-items:center;gap:6px;font-family:var(--font-ui);
    transition:background .12s;
  }
  .btn:hover{background:#333;}
  .btn:active{background:#3a3a3a;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500;}
  .btn.primary:hover{background:#2f6fd6;}
  .btn.primary:disabled{opacity:.5;cursor:default;}
  .btn.icon{padding:5px 8px;}
  #run-status{font-size:11px;color:var(--text-dim);margin-right:4px;}
  #conn-indicator{
    display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-dim);
    padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius);
  }
  #conn-indicator .led{width:7px;height:7px;border-radius:50%;background:var(--err);transition:background .2s;}
  #conn-indicator.connected .led{background:var(--ok);box-shadow:0 0 6px rgba(63,185,80,.6);}

  /* ---------- Body layout ---------- */
  #body{
    display:grid;
    grid-template-columns:auto 240px 1fr;
    min-height:0;
  }
  #activitybar{
    background:var(--bg-activitybar);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;
    padding-top:8px;gap:4px;width:44px;
  }
  .abtn{
    width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);cursor:pointer;
  }
  .abtn.active{color:#fff;background:#2a2a2a;}
  .abtn:hover{color:#fff;}

  /* ---------- Sidebar (file explorer) ---------- */
  #sidebar{
    background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0;
  }
  #sidebar-header{
    padding:9px 12px 6px;
    font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--text-dim);
    display:flex;align-items:center;justify-content:space-between;
  }
  #sidebar-actions{display:flex;gap:2px;}
  #sidebar-actions .abtn{width:24px;height:24px;color:var(--text-dim);}
  #sidebar-actions .abtn:hover{color:#fff;background:#2a2a2a;}
  #file-tree{flex:1;overflow-y:auto;padding:2px 0 12px;}
  #file-tree::-webkit-scrollbar,.term-wrap::-webkit-scrollbar{width:10px;}
  #file-tree::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:5px;}
  .tree-node{user-select:none;}
  .tree-row{
    display:flex;align-items:center;gap:5px;padding:3px 8px 3px 0;
    cursor:pointer;white-space:nowrap;color:var(--text-main);border-radius:2px;
  }
  .tree-row:hover{background:#232323;}
  .tree-row.selected{background:#2a3f5c;}
  .tree-row .chev{width:14px;text-align:center;color:var(--text-faint);font-size:9px;flex-shrink:0;}
  .tree-row .fic{width:14px;flex-shrink:0;text-align:center;font-size:12px;}
  .tree-row .name{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;}
  .tree-children{display:none;}
  .tree-children.open{display:block;}
  #tree-empty{padding:14px 12px;color:var(--text-faint);font-size:12px;line-height:1.5;}

  /* ---------- Editor area ---------- */
  #editor-area{display:flex;flex-direction:column;min-width:0;min-height:0;}
  #tabs{
    display:flex;background:var(--bg-tab-inactive);border-bottom:1px solid var(--border);
    overflow-x:auto;min-height:34px;flex-shrink:0;
  }
  #tabs::-webkit-scrollbar{height:0;}
  .tab{
    display:flex;align-items:center;gap:7px;padding:0 10px;
    background:var(--bg-tab-inactive);border-right:1px solid var(--border);
    font-size:12.5px;color:var(--text-dim);cursor:pointer;white-space:nowrap;height:34px;
  }
  .tab.active{background:var(--bg-tab-active);color:#fff;border-top:2px solid var(--accent);height:32px;}
  .tab .dirty{width:7px;height:7px;border-radius:50%;background:#fff;display:none;}
  .tab.is-dirty .dirty{display:block;}
  .tab.is-dirty .xclose{display:none;}
  .tab .xclose{color:var(--text-faint);font-size:14px;line-height:1;padding:2px;}
  .tab .xclose:hover{color:#fff;}
  .tab:hover .dirty{display:none;}
  .tab:hover .xclose{display:block;}

  #editor-host{flex:1;min-height:0;position:relative;}
  #editor-placeholder{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--text-faint);gap:10px;
  }
  #editor-placeholder .glyph{font-size:38px;opacity:.35;}
  #editor-placeholder .hint{font-size:12px;}
  #editor-placeholder kbd{
    background:#2a2a2a;border:1px solid var(--border);border-radius:3px;padding:1px 6px;font-family:var(--font-mono);
  }

  /* ---------- Terminal panel ---------- */
  #panel-resizer{height:4px;cursor:row-resize;background:transparent;flex-shrink:0;}
  #panel-resizer:hover{background:var(--accent-dim);}
  #terminal-panel{
    height:260px;display:flex;flex-direction:column;border-top:1px solid var(--border);
    background:#121212;flex-shrink:0;
  }
  #terminal-header{
    display:flex;align-items:center;padding:0 10px;height:30px;
    border-bottom:1px solid var(--border);gap:10px;flex-shrink:0;
  }
  #terminal-header .title{font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--text-dim);}
  .term-wrap{flex:1;min-height:0;padding:6px 0 0 10px;overflow:hidden;}

  /* ---------- Debug banner (temporary diagnostics) ---------- */
  #debug-banner{
    display:none;position:fixed;top:38px;left:0;right:0;z-index:1001;
    background:#3a1f1f;border-bottom:1px solid #6b2b2b;color:#ffb4b4;
    font-family:var(--font-mono);font-size:11px;padding:8px 10px;white-space:pre-wrap;
    max-height:160px;overflow-y:auto;
  }
  #debug-banner.show{display:block;}
  #debug-banner .close{float:right;cursor:pointer;color:#ffb4b4;font-family:var(--font-ui);}

  /* ---------- Context menu ---------- */
  #ctx-menu{
    position:fixed;z-index:999;background:#252525;border:1px solid var(--border);
    border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.5);padding:4px;display:none;min-width:150px;
  }
  #ctx-menu .item{padding:6px 10px;font-size:12.5px;border-radius:4px;cursor:pointer;color:var(--text-main);}
  #ctx-menu .item:hover{background:var(--accent);color:#fff;}
  #ctx-menu .item.danger:hover{background:#a4342a;}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#252525;border:1px solid var(--border);color:#fff;
    padding:9px 16px;border-radius:6px;font-size:12.5px;opacity:0;pointer-events:none;
    transition:all .2s;box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:1000;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.err{border-color:#a4342a;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;
    align-items:center;justify-content:center;z-index:998;
  }
  .modal-overlay.show{display:flex;}
  .modal{background:#252525;border:1px solid var(--border);border-radius:8px;padding:18px;width:320px;}
  .modal h3{margin:0 0 12px;font-size:13px;font-weight:600;}
  .modal input{
    width:100%;background:#1a1a1a;border:1px solid var(--border);color:#fff;
    border-radius:4px;padding:7px 9px;font-size:13px;font-family:var(--font-mono);margin-bottom:12px;
  }
  .modal input:focus{outline:1px solid var(--accent);}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;}

  input[type=file]{display:none;}
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="brand"><span class="dot"></span> Pro Web IDE</div>
    <div class="spacer"></div>
    <span id="run-status"></span>
    <button class="btn primary" id="btn-run">▶ Run Code</button>
    <button class="btn icon" id="btn-save" title="Save (Ctrl+S)">💾</button>
    <div id="conn-indicator"><span class="led"></span><span id="conn-label">Disconnected</span></div>
  </div>
  <div id="debug-banner"><span class="close" id="debug-close">✕ close</span><div id="debug-log"></div></div>

  <div id="body">
    <div id="activitybar">
      <div class="abtn active" title="Explorer">📁</div>
      <div class="abtn" title="Terminal" id="ab-terminal">⌨</div>
    </div>

    <div id="sidebar">
      <div id="sidebar-header">
        <span>EXPLORER</span>
        <div id="sidebar-actions">
          <div class="abtn" id="btn-new-file" title="New File">📄</div>
          <div class="abtn" id="btn-new-folder" title="New Folder">📂</div>
          <div class="abtn" id="btn-upload" title="Upload File">⬆</div>
          <div class="abtn" id="btn-refresh" title="Refresh">⟳</div>
        </div>
      </div>
      <div id="file-tree"><div id="tree-empty">Loading…</div></div>
      <input type="file" id="file-input" multiple />
    </div>

    <div id="editor-area">
      <div id="tabs"></div>
      <div id="editor-host">
        <div id="editor-placeholder">
          <div class="glyph">⌘</div>
          <div class="hint">Select a file to start editing · <kbd>Ctrl</kbd>+<kbd>S</kbd> to save</div>
        </div>
      </div>

      <div id="panel-resizer"></div>
      <div id="terminal-panel">
        <div id="terminal-header">
          <span class="title">TERMINAL</span>
          <div class="spacer" style="flex:1"></div>
          <div class="btn icon" id="btn-clear-term" title="Clear">⌫</div>
        </div>
        <div class="term-wrap" id="term-wrap"></div>
      </div>
    </div>
  </div>
</div>

<div id="ctx-menu"></div>
<div id="toast"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">New File</h3>
    <input id="modal-input" placeholder="name.py" autocomplete="off" spellcheck="false" />
    <div class="row">
      <button class="btn" id="modal-cancel">Cancel</button>
      <button class="btn primary" id="modal-ok">Create</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm-addon-fit/0.8.0/addon-fit.min.js"></script>
<script>
/* ============================================================
   Pro Web IDE — frontend logic
   ============================================================ */
const state = {
  tree: null,
  openTabs: [],      // [{path, model, dirty}]
  activePath: null,
  editor: null,
  monacoReady: false,
  ctxTargetPath: null,
  ctxTargetType: null,
};

const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text!==undefined) e.textContent = text; return e; };

/* ---------------- Temporary debug banner (surfaces real errors on-screen for mobile debugging) ---------------- */
function debugLog(msg){
  const banner = $('#debug-banner');
  const log = $('#debug-log');
  const line = document.createElement('div');
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  log.appendChild(line);
  banner.classList.add('show');
}
$('#debug-close').addEventListener('click', ()=> $('#debug-banner').classList.remove('show'));
window.addEventListener('error', (e)=>{
  debugLog(`JS ERROR: ${e.message} (${e.filename ? e.filename.split('/').pop() : '?'}:${e.lineno})`);
});
window.addEventListener('unhandledrejection', (e)=>{
  debugLog(`UNHANDLED PROMISE REJECTION: ${e.reason}`);
});

function toast(msg, isErr=false){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.className = t.className.replace('show',''), 2600);
}

/* ---------------- Language detection ---------------- */
const LANG_MAP = {
  py:'python', js:'javascript', jsx:'javascript', ts:'typescript', tsx:'typescript',
  html:'html', htm:'html', css:'css', scss:'scss', json:'json', md:'markdown',
  sh:'shell', bash:'shell', yml:'yaml', yaml:'yaml', xml:'xml', sql:'sql',
  java:'java', c:'c', h:'c', cpp:'cpp', hpp:'cpp', cs:'csharp', go:'go',
  rs:'rust', rb:'ruby', php:'php', txt:'plaintext', dockerfile:'dockerfile',
};
function langFor(path){
  const name = path.split('/').pop().toLowerCase();
  if(name === 'dockerfile') return 'dockerfile';
  const ext = name.includes('.') ? name.split('.').pop() : '';
  return LANG_MAP[ext] || 'plaintext';
}
const FILE_ICONS = {
  py:'🐍', js:'📜', jsx:'📜', ts:'📘', tsx:'📘', html:'🌐', css:'🎨',
  json:'🧩', md:'📝', sh:'⚙️', yml:'⚙️', yaml:'⚙️', java:'☕', c:'🔧',
  cpp:'🔧', go:'🐹', rs:'🦀', rb:'💎', php:'🐘', txt:'📄',
};
function iconFor(node){
  if(node.type === 'folder') return '📁';
  const ext = node.name.includes('.') ? node.name.split('.').pop().toLowerCase() : '';
  return FILE_ICONS[ext] || '📄';
}

/* ============================================================
   Monaco setup
   ============================================================ */
require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
require(['vs/editor/editor.main'], function () {
  monaco.editor.defineTheme('pro-dark', {
    base: 'vs-dark', inherit: true, rules: [],
    colors: {
      'editor.background': '#1e1e1e',
      'editor.lineHighlightBackground': '#252525',
      'editorLineNumber.foreground': '#4b4b4b',
      'editorLineNumber.activeForeground': '#c8c8c8',
      'editorCursor.foreground': '#3b82f6',
      'editorIndentGuide.background': '#2a2a2a',
    }
  });
  state.editor = monaco.editor.create(document.getElementById('editor-host'), {
    theme: 'pro-dark',
    automaticLayout: true,
    fontFamily: "'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace",
    fontSize: 13.5,
    minimap: { enabled: true },
    smoothScrolling: true,
    cursorBlinking: 'smooth',
    scrollBeyondLastLine: false,
    autoClosingBrackets: 'languageDefined',
    autoClosingQuotes: 'languageDefined',
    bracketPairColorization: { enabled: true },
    tabSize: 4,
  });
  document.getElementById('editor-placeholder').style.display = 'none';
  state.editor.getDomNode() && (state.editor.getDomNode().style.display = 'none');

  state.editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, saveActiveFile);
  state.monacoReady = true;
  loadTree();
});

/* ============================================================
   File tree
   ============================================================ */
async function loadTree(){
  try{
    const res = await fetch('/api/tree');
    state.tree = await res.json();
    renderTree();
  }catch(e){
    toast('Failed to load file tree', true);
  }
}

function renderTree(){
  const container = $('#file-tree');
  container.innerHTML = '';
  if(!state.tree.children || state.tree.children.length === 0){
    const e = el('div', null, 'No files yet — create one to get started.');
    e.id = 'tree-empty';
    container.appendChild(e);
    return;
  }
  container.appendChild(renderNode(state.tree, 0, true));
}

function renderNode(node, depth, isRoot=false){
  const wrap = el('div', 'tree-node');
  if(isRoot){
    node.children.forEach(child => wrap.appendChild(renderNode(child, depth)));
    return wrap;
  }
  const row = el('div', 'tree-row');
  row.style.paddingLeft = (depth*14 + 6) + 'px';
  row.dataset.path = node.path;

  if(node.type === 'folder'){
    const chev = el('span','chev','▸');
    const ic = el('span','fic','📁');
    const name = el('span','name', node.name);
    row.append(chev, ic, name);

    const childWrap = el('div','tree-children');
    node.children.forEach(c => childWrap.appendChild(renderNode(c, depth+1)));

    row.addEventListener('click', ()=>{
      const open = childWrap.classList.toggle('open');
      chev.textContent = open ? '▾' : '▸';
      ic.textContent = open ? '📂' : '📁';
    });
    row.addEventListener('contextmenu', (e)=> openCtxMenu(e, node.path, 'folder'));

    const holder = el('div');
    holder.append(row, childWrap);
    return holder;
  } else {
    const chev = el('span','chev','');
    const ic = el('span','fic', iconFor(node));
    const name = el('span','name', node.name);
    row.append(chev, ic, name);
    row.addEventListener('click', ()=> openFile(node.path));
    row.addEventListener('contextmenu', (e)=> openCtxMenu(e, node.path, 'file'));
    return row;
  }
}

function highlightSelected(path){
  document.querySelectorAll('.tree-row').forEach(r => r.classList.toggle('selected', r.dataset.path === path));
}

/* ============================================================
   Tabs & editor content
   ============================================================ */
async function openFile(path){
  highlightSelected(path);
  let tab = state.openTabs.find(t => t.path === path);
  if(!tab){
    try{
      const res = await fetch('/api/file?path=' + encodeURIComponent(path));
      if(!res.ok){
        const err = await res.json().catch(()=>({detail:'Could not open file'}));
        toast(err.detail || 'Could not open file', true);
        return;
      }
      const data = await res.json();
      const model = monaco.editor.createModel(data.content, langFor(path));
      model.onDidChangeContent(()=> markDirty(path, true));
      tab = { path, model, dirty: false };
      state.openTabs.push(tab);
    }catch(e){
      toast('Could not open file', true);
      return;
    }
  }
  activateTab(path);
}

function activateTab(path){
  state.activePath = path;
  const tab = state.openTabs.find(t => t.path === path);
  if(!tab) return;
  state.editor.setModel(tab.model);
  state.editor.getDomNode().style.display = 'block';
  document.getElementById('editor-placeholder').style.display = 'none';
  state.editor.focus();
  renderTabs();
  highlightSelected(path);
}

function markDirty(path, val){
  const tab = state.openTabs.find(t => t.path === path);
  if(tab) tab.dirty = val;
  renderTabs();
}

function renderTabs(){
  const bar = $('#tabs');
  bar.innerHTML = '';
  state.openTabs.forEach(t => {
    const tabEl = el('div', 'tab' + (t.path === state.activePath ? ' active' : '') + (t.dirty ? ' is-dirty' : ''));
    const ic = el('span', null, iconFor({name:t.path, type:'file'}));
    const name = el('span', null, t.path.split('/').pop());
    const dirty = el('span','dirty');
    const xclose = el('span','xclose','✕');
    tabEl.append(ic, name, dirty, xclose);
    tabEl.addEventListener('click', (e)=>{ if(e.target !== xclose) openFile(t.path); });
    xclose.addEventListener('click', (e)=>{ e.stopPropagation(); closeTab(t.path); });
    bar.appendChild(tabEl);
  });
}

function closeTab(path){
  const idx = state.openTabs.findIndex(t => t.path === path);
  if(idx === -1) return;
  if(state.openTabs[idx].dirty && !confirm(`"${path.split('/').pop()}" has unsaved changes. Close anyway?`)) return;
  state.openTabs[idx].model.dispose();
  state.openTabs.splice(idx, 1);
  if(state.activePath === path){
    if(state.openTabs.length){
      activateTab(state.openTabs[Math.max(0, idx-1)].path);
    } else {
      state.activePath = null;
      state.editor.setModel(null);
      state.editor.getDomNode().style.display = 'none';
      document.getElementById('editor-placeholder').style.display = 'flex';
    }
  }
  renderTabs();
}

async function saveActiveFile(){
  if(!state.activePath) return;
  const tab = state.openTabs.find(t => t.path === state.activePath);
  if(!tab) return;
  try{
    const res = await fetch('/api/file', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ path: tab.path, content: tab.model.getValue() })
    });
    if(!res.ok) throw new Error();
    tab.dirty = false;
    renderTabs();
    toast('Saved ' + tab.path.split('/').pop());
    return true;
  }catch(e){
    toast('Save failed', true);
    return false;
  }
}
$('#btn-save').addEventListener('click', saveActiveFile);

/* ============================================================
   New file / folder / rename / delete / upload
   ============================================================ */
function showModal(title, placeholder, defaultVal, onOk){
  const overlay = $('#modal-overlay');
  $('#modal-title').textContent = title;
  const input = $('#modal-input');
  input.placeholder = placeholder;
  input.value = defaultVal || '';
  overlay.classList.add('show');
  input.focus();
  if(defaultVal){
    const dot = defaultVal.lastIndexOf('.');
    input.setSelectionRange(0, dot > 0 ? dot : defaultVal.length);
  }
  const cleanup = ()=>{ overlay.classList.remove('show'); ok.removeEventListener('click', go); input.removeEventListener('keydown', keyHandler); };
  const go = ()=>{ const v = input.value.trim(); cleanup(); if(v) onOk(v); };
  const keyHandler = (e)=>{ if(e.key==='Enter') go(); if(e.key==='Escape') cleanup(); };
  const ok = $('#modal-ok');
  ok.addEventListener('click', go);
  input.addEventListener('keydown', keyHandler);
  $('#modal-cancel').onclick = cleanup;
}

$('#btn-new-file').addEventListener('click', ()=>{
  const base = state.ctxTargetType === 'folder' ? state.ctxTargetPath : '';
  showModal('New File', 'e.g. main.py', '', async (name)=>{
    const path = base ? `${base}/${name}` : name;
    const res = await fetch('/api/create', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path, type:'file'}) });
    if(res.ok){ await loadTree(); openFile(path); } else toast('Could not create file', true);
  });
});
$('#btn-new-folder').addEventListener('click', ()=>{
  const base = state.ctxTargetType === 'folder' ? state.ctxTargetPath : '';
  showModal('New Folder', 'e.g. src', '', async (name)=>{
    const path = base ? `${base}/${name}` : name;
    const res = await fetch('/api/create', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path, type:'folder'}) });
    if(res.ok){ await loadTree(); toast('Folder created'); } else toast('Could not create folder', true);
  });
});
$('#btn-refresh').addEventListener('click', loadTree);

$('#btn-upload').addEventListener('click', ()=> $('#file-input').click());
$('#file-input').addEventListener('change', async (e)=>{
  const files = Array.from(e.target.files || []);
  const dest = state.ctxTargetType === 'folder' ? state.ctxTargetPath : '';
  for(const f of files){
    const fd = new FormData();
    fd.append('file', f);
    try{
      const res = await fetch('/api/upload?dest=' + encodeURIComponent(dest), { method:'POST', body: fd });
      if(!res.ok) throw new Error();
    }catch(err){ toast(`Upload failed: ${f.name}`, true); }
  }
  toast(`Uploaded ${files.length} file(s)`);
  e.target.value = '';
  loadTree();
});

/* ---------------- Context menu ---------------- */
const ctxMenuEl = $('#ctx-menu');
function openCtxMenu(e, path, type){
  e.preventDefault(); e.stopPropagation();
  state.ctxTargetPath = path;
  state.ctxTargetType = type;
  ctxMenuEl.innerHTML = '';
  const items = [
    ['New File', ()=> $('#btn-new-file').click()],
    ['New Folder', ()=> $('#btn-new-folder').click()],
    ['Rename', ()=> renameTarget(path)],
    ['Delete', ()=> deleteTarget(path), true],
  ];
  items.forEach(([label, fn, danger])=>{
    const item = el('div', 'item' + (danger?' danger':''), label);
    item.addEventListener('click', ()=>{ closeCtx(); fn(); });
    ctxMenuEl.appendChild(item);
  });
  ctxMenuEl.style.left = e.clientX + 'px';
  ctxMenuEl.style.top = e.clientY + 'px';
  ctxMenuEl.style.display = 'block';
}
function closeCtx(){ ctxMenuEl.style.display = 'none'; }
document.addEventListener('click', closeCtx);

function renameTarget(path){
  const parts = path.split('/');
  const oldName = parts.pop();
  showModal('Rename', 'new name', oldName, async (newName)=>{
    const newPath = [...parts, newName].join('/');
    const res = await fetch('/api/rename', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({old_path:path, new_path:newPath}) });
    if(res.ok){
      const tab = state.openTabs.find(t=>t.path===path);
      if(tab) tab.path = newPath;
      await loadTree();
      toast('Renamed');
    } else toast('Rename failed', true);
  });
}
async function deleteTarget(path){
  if(!confirm(`Delete "${path}"? This cannot be undone.`)) return;
  const res = await fetch('/api/file?path=' + encodeURIComponent(path), { method:'DELETE' });
  if(res.ok){
    closeTab(path);
    await loadTree();
    toast('Deleted');
  } else toast('Delete failed', true);
}

/* ============================================================
   Terminal (xterm.js + PTY over WebSocket)
   ============================================================ */
let term, fitAddon;
try{
  if(typeof Terminal === 'undefined') throw new Error('xterm.js failed to load from CDN (Terminal is undefined)');
  if(typeof FitAddon === 'undefined') throw new Error('xterm-addon-fit failed to load from CDN (FitAddon is undefined)');
  term = new Terminal({
    fontFamily: "'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace",
    fontSize: 13,
    theme: {
      background: '#121212', foreground: '#d4d4d4', cursor: '#3b82f6',
      black:'#1e1e1e', red:'#f85149', green:'#3fb950', yellow:'#d29922',
      blue:'#3b82f6', magenta:'#bc8cff', cyan:'#39c5cf', white:'#d4d4d4',
    },
    cursorBlink: true,
    scrollback: 5000,
  });
  fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('term-wrap'));
  fitAddon.fit();
  debugLog('Terminal (xterm.js) initialized OK.');
}catch(e){
  debugLog(`TERMINAL INIT FAILED: ${e.message}`);
  toast('Terminal failed to load — see debug banner at top', true);
}

let ws = null;
let wsConnected = false;
let reconnectTimer = null;
let termMode = 'pty';   // 'pty' (real TTY, server echoes) or 'pipe' (no TTY, client echoes locally)
let lineBuffer = '';    // used only in 'pipe' mode

function setConnUI(connected){
  wsConnected = connected;
  const ind = $('#conn-indicator');
  ind.classList.toggle('connected', connected);
  $('#conn-label').textContent = connected ? 'Connected' : 'Disconnected';
}

function connectTerminal(){
  const wsUrl = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws/terminal`;
  debugLog(`Connecting WebSocket: ${wsUrl}`);
  ws = new WebSocket(wsUrl);

  ws.onopen = ()=>{
    setConnUI(true);
    debugLog('WebSocket OPEN.');
    clearTimeout(reconnectTimer);
    sendResize();
  };
  ws.onmessage = (evt)=>{
    try{
      const msg = JSON.parse(evt.data);
      if(msg.type === 'output'){
        term.write(msg.data);
      } else if(msg.type === 'mode'){
        termMode = msg.mode;
        lineBuffer = '';
        if(msg.mode === 'pty'){
          term.writeln('\x1b[90m# connected — real bash shell, workspace-rooted\x1b[0m');
        } else {
          term.writeln('\x1b[33m# limited mode: no real TTY on this host (sandboxed container).\x1b[0m');
          term.writeln('\x1b[90m# pip install / running scripts / cd all work. Full-screen apps (nano, htop, vim) will not.\x1b[0m');
        }
      }
    }catch(e){}
  };
  ws.onclose = (evt)=>{
    setConnUI(false);
    debugLog(`WebSocket CLOSED — code:${evt.code} reason:"${evt.reason || '(none)'}" wasClean:${evt.wasClean}`);
    reconnectTimer = setTimeout(connectTerminal, 2000);
  };
  ws.onerror = (evt)=>{
    debugLog(`WebSocket ERROR event fired (readyState:${ws.readyState}). Browsers hide details — check the close code above.`);
    ws.close();
  };
}

if(term){
  term.onData(data => {
    if(!ws || ws.readyState !== WebSocket.OPEN) return;

    if(termMode === 'pty'){
      // Real TTY: server echoes everything back, just forward raw keystrokes.
      ws.send(JSON.stringify({ type:'input', data }));
      return;
    }

    // Pipe fallback mode: no server-side echo, so do it here + line-buffer.
    for(const ch of data){
      const code = ch.charCodeAt(0);
      if(ch === '\r' || ch === '\n'){
        term.write('\r\n');
        ws.send(JSON.stringify({ type:'input', data: lineBuffer + '\n' }));
        lineBuffer = '';
      } else if(code === 127 || code === 8){ // backspace
        if(lineBuffer.length){
          lineBuffer = lineBuffer.slice(0, -1);
          term.write('\b \b');
        }
      } else if(code === 3){ // Ctrl+C — best-effort in pipe mode: clear the pending line
        lineBuffer = '';
        term.write('^C\r\n');
      } else if(code >= 32){
        lineBuffer += ch;
        term.write(ch);
      }
    }
  });
}

function sendResize(){
  if(term && fitAddon && ws && ws.readyState === WebSocket.OPEN){
    fitAddon.fit();
    ws.send(JSON.stringify({ type:'resize', rows: term.rows, cols: term.cols }));
  }
}
function sendCommand(cmd){
  if(!wsConnected || !ws || ws.readyState !== WebSocket.OPEN){
    toast('Terminal not connected — refresh the page and try again', true);
    return;
  }
  if(termMode === 'pipe' && term){
    // No server-side echo in this mode — show the command ourselves.
    term.write(cmd + '\r\n');
    lineBuffer = '';
  }
  ws.send(JSON.stringify({ type:'input', data: cmd + '\n' }));
}

if(term){
  connectTerminal();
  window.addEventListener('resize', sendResize);
  new ResizeObserver(sendResize).observe(document.getElementById('terminal-panel'));
  $('#btn-clear-term').addEventListener('click', ()=> term.clear());
  $('#ab-terminal').addEventListener('click', ()=> term.focus());
} else {
  debugLog('Skipping WebSocket/terminal wiring since xterm failed to initialize.');
}

/* ---------------- Terminal panel resize (drag) ---------------- */
(function(){
  const resizer = $('#panel-resizer');
  const panel = $('#terminal-panel');
  let dragging = false;
  resizer.addEventListener('mousedown', ()=>{ dragging = true; document.body.style.cursor='row-resize'; });
  window.addEventListener('mousemove', (e)=>{
    if(!dragging) return;
    const rect = document.getElementById('editor-area').getBoundingClientRect();
    let h = rect.bottom - e.clientY;
    h = Math.max(120, Math.min(h, rect.height - 120));
    panel.style.height = h + 'px';
    sendResize();
  });
  window.addEventListener('mouseup', ()=>{ dragging = false; document.body.style.cursor=''; });
})();

/* ============================================================
   Run Code — auto-save then execute in terminal
   ============================================================ */
$('#btn-run').addEventListener('click', async ()=>{
  if(!state.activePath){ toast('Open a file first', true); return; }
  if(!wsConnected){ toast('Terminal disconnected — refresh the page', true); return; }

  const btn = $('#btn-run');
  btn.disabled = true;
  $('#run-status').textContent = 'Saving…';
  const saved = await saveActiveFile();
  if(!saved){ btn.disabled = false; $('#run-status').textContent=''; return; }

  $('#run-status').textContent = 'Running…';
  try{
    const res = await fetch('/api/run-command?path=' + encodeURIComponent(state.activePath));
    if(!res.ok){
      const err = await res.json().catch(()=>({detail:'Cannot run this file type'}));
      toast(err.detail, true);
      $('#run-status').textContent = '';
      btn.disabled = false;
      return;
    }
    const { command } = await res.json();
    if(term) term.focus();
    sendCommand(command);
  }catch(e){
    toast('Run failed', true);
  }
  setTimeout(()=>{ btn.disabled = false; $('#run-status').textContent=''; }, 600);
});

/* Keyboard shortcut for Run: Ctrl+Enter */
window.addEventListener('keydown', (e)=>{
  if((e.ctrlKey||e.metaKey) && e.key === 'Enter'){ e.preventDefault(); $('#btn-run').click(); }
});

/* Warn before leaving with unsaved changes */
window.addEventListener('beforeunload', (e)=>{
  if(state.openTabs.some(t=>t.dirty)){ e.preventDefault(); e.returnValue=''; }
});
</script>
